<title>CLR Peneleh - Telemarketing v7</title>
<style>
:root{--blue:#0b3fd1;--navy:#06206b;--sky:#e8f0ff;--red:#e5243b;--yel:#ffc21a;--ink:#10224f;--mut:#51628f;--line:#c7d6f7}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html{font-size:18px;-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{margin:0;min-height:100vh;font-family:'Segoe UI',system-ui,-apple-system,Roboto,Arial,sans-serif;color:var(--ink);line-height:1.4;background:#0b3fd1;background:linear-gradient(165deg,#041a66 0%,#0b3fd1 60%,#2f7bff 100%) fixed;overflow-x:hidden}
#stars{position:fixed;top:0;left:0;width:100%;height:100%;z-index:0;pointer-events:none}
.blob{position:fixed;border-radius:50%;-webkit-filter:blur(70px);filter:blur(70px);opacity:.3;z-index:0;pointer-events:none;animation:fl 18s ease-in-out infinite}
.b1{width:300px;height:300px;background:var(--red);top:-90px;right:-90px}
.b2{width:280px;height:280px;background:var(--yel);bottom:-100px;left:-90px;animation-delay:-8s}
@keyframes fl{0%,100%{transform:translate(0,0)}50%{transform:translate(26px,-34px)}}
#app{position:relative;z-index:1;max-width:1000px;margin:0 auto;padding:10px 14px 130px;padding:calc(10px + env(safe-area-inset-top)) 14px 130px}

/* header */
.top{display:flex;align-items:center;padding:10px 12px;margin-bottom:14px;color:#fff;border-radius:22px;background:rgba(10,40,150,.55);background:linear-gradient(135deg,rgba(255,255,255,.26),rgba(255,255,255,.08));-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);border:1px solid rgba(255,255,255,.38);box-shadow:0 8px 28px rgba(2,10,60,.3),inset 0 1px 0 rgba(255,255,255,.5)}
.logo{width:56px;height:56px;border-radius:50%;object-fit:cover;background:#000;border:2px solid rgba(255,255,255,.85);flex:none;margin-right:12px}
.logo.big{width:120px;height:120px;border-width:4px;margin:0 auto 10px;display:block;box-shadow:0 8px 24px rgba(6,32,107,.4)}
.who{flex:1;min-width:0}
.top .t1{font-weight:800;font-size:1rem;line-height:1.15}
.top .t2{font-size:.85rem;opacity:.95}
.menu-btn{flex:none;margin-left:10px;min-width:96px;height:52px;padding:0 14px;border-radius:16px;border:2px solid rgba(255,255,255,.65);background:rgba(255,255,255,.18);color:#fff;font-family:inherit;font-size:1rem;font-weight:800;cursor:pointer}

/* tombol */
.btn{display:flex;align-items:center;justify-content:center;min-height:58px;padding:12px 18px;border:0;border-radius:16px;font-family:inherit;font-weight:800;font-size:1rem;line-height:1.2;cursor:pointer;text-decoration:none;text-align:center;color:#fff;background:var(--blue);box-shadow:0 4px 0 rgba(0,0,0,.2);transition:transform .08s}
.btn:active{transform:translateY(3px);box-shadow:none}
.btn:focus-visible,.bi:focus-visible,.tile:focus-visible{outline:4px solid var(--navy);outline-offset:2px}
.btn.block{width:100%}
.btn small{display:block;font-weight:600;font-size:.9rem;opacity:.95}
.btn-red{background:linear-gradient(#ff5367,#e5243b)}
.btn-yel{background:linear-gradient(#ffd75a,#ffc21a);color:#3a2900}
.btn-blue{background:linear-gradient(#3a74ff,#0b3fd1)}
.btn-call{background:linear-gradient(#2fcf6b,#15803d)}
.btn-sol{background:linear-gradient(#ffd75a,#ffb300);color:#3a2900}.btn-nosol{background:linear-gradient(#8a99c2,#51628f)}
.sol{padding:12px;border-radius:16px;background:var(--sky)}.sol-t{font-weight:800;margin-bottom:10px;color:var(--navy)}.btn-fu{background:linear-gradient(#2a5bd7,#06206b)}.sol.fu{border:3px solid transparent}.sol.fu.due{border-color:var(--red);background:#fff1f2}
.tgrp{grid-column:1/-1;color:#fff;font-weight:800;font-size:.95rem;margin:6px 2px 0}
.sol-t.big{font-size:1.2rem;text-align:center;margin:10px 0 14px}
.rk{width:100%;border-collapse:collapse;font-size:.8rem}.rk th,.rk td{padding:8px 2px;text-align:center;border-bottom:1px solid var(--line)}.rk th{color:var(--mut);font-size:.62rem;line-height:1.1}.rk td:first-child,.rk th:first-child{text-align:left;font-weight:800}.rk tr.tot td{font-weight:800;background:var(--sky)}.rkw{overflow-x:auto}
.btn-light{background:#fff;color:var(--blue);border:2px solid var(--line);box-shadow:none}
.btn.on{outline:4px solid var(--navy);outline-offset:2px}
.btn.dim{opacity:.45}
.btn[disabled]{opacity:.5;pointer-events:none}
summary.btn{list-style:none}summary.btn::-webkit-details-marker{display:none}
.btn-mail{background:linear-gradient(#7466ff,#3b2fd1)}
.sol.em .btn,.sol.em .two{margin-top:10px}.sol.em{border:3px solid transparent}.sol.em.wait{border-color:var(--yel);background:#fff9e6}.sol.em.ok{border-color:#15803d;background:#effaf3}.sol.em.bad{border-color:var(--red);background:#fff1f2}
.warnbox{padding:10px 12px;border-radius:12px;background:#fff4d6;border:2px solid var(--yel);font-weight:700;font-size:.9rem;color:#5a3d00}
.okbox{padding:10px 12px;border-radius:12px;background:#effaf3;border:2px solid #15803d;font-weight:700;font-size:.9rem;color:#0b5a2b}
.infobox{padding:10px 12px;border-radius:12px;background:var(--sky);border:2px solid var(--line);font-weight:700;font-size:.9rem;color:var(--navy)}
.empre{margin-top:10px;max-height:46vh;overflow:auto;padding:12px;border-radius:14px;background:var(--sky);font-size:.9rem;line-height:1.5;word-break:break-word}
.kv{display:flex;justify-content:space-between;align-items:flex-start;padding:6px 0;border-bottom:1px dashed var(--line);font-size:.92rem}.kv span{color:var(--mut);flex:none;margin-right:12px}.kv b{text-align:right;word-break:break-word}

/* isian */
.inp{display:block;width:100%;min-height:58px;padding:12px 16px;border:2px solid var(--line);border-radius:16px;font-family:inherit;font-size:1rem;color:var(--ink);background:#fff;outline:none;-webkit-appearance:none;appearance:none}
select.inp{-webkit-appearance:menulist;appearance:auto}
.inp:focus{border-color:var(--blue);box-shadow:0 0 0 4px rgba(11,63,209,.18)}
textarea.inp{min-height:96px}
.lb{display:block;font-weight:800;margin:14px 0 6px}
.chk{display:flex;align-items:center;margin-top:12px;font-weight:700;cursor:pointer}
.chk input{margin-right:12px}
input[type=checkbox]{width:30px;height:30px;accent-color:var(--blue);flex:none}

/* kartu */
.panel,.card{background:#f9fbff;background:rgba(255,255,255,.97);border-radius:22px;box-shadow:0 10px 30px rgba(2,10,60,.28);padding:16px;color:var(--ink)}
.card{display:grid;grid-gap:12px;gap:12px}
.card h3{margin:0;font-size:1.25rem;line-height:1.25;color:var(--navy)}
.addr{margin:0;color:var(--mut);font-size:.95rem}
.badge{display:inline-block;padding:6px 12px;border-radius:999px;font-weight:800;font-size:.85rem;background:#e5ecfb;color:var(--navy)}
.bd-red{background:var(--red);color:#fff}.bd-yel{background:var(--yel);color:#3a2900}.bd-blue{background:var(--blue);color:#fff}
.no{font-weight:700;color:var(--mut);font-size:.9rem}
.c-top{display:flex;justify-content:space-between;align-items:center}
.cards{display:grid;grid-gap:14px;gap:14px;grid-template-columns:1fr}
.stack{display:grid;grid-gap:12px;gap:12px}
.ttl{color:#fff;font-size:1.3rem;font-weight:800;margin:6px 4px 12px}
.sub{color:var(--mut);font-size:.95rem;margin:4px 0 12px}
.err{margin-top:14px;padding:12px 14px;border-radius:14px;background:#ffe3e6;color:#9b1226;font-weight:700}
.notice{margin:6px 2px 12px;color:#fff;font-weight:700;text-align:center}
.note>div{display:grid;grid-gap:4px;gap:4px;margin-top:10px}
.srv{margin:14px 0 0;text-align:center;font-size:.85rem;font-weight:700;color:var(--mut)}
.srv.ok{color:#0b7a3f}.srv.bad{color:#b3122a}.srv.warn{color:#9a5b00}
.ver{margin:6px 0 0;text-align:center;font-size:.75rem;color:#8a99c2}

/* ringkasan angka (juga dipakai sebagai filter) */
.tiles{display:grid;grid-gap:10px;gap:10px;grid-template-columns:1fr 1fr;margin-bottom:12px}
.tile{display:block;width:100%;border:0;border-radius:18px;padding:12px 14px 16px;text-align:left;background:#fff;color:var(--ink);font-family:inherit;box-shadow:inset 0 -7px 0 var(--ac,#c7d6f7),0 6px 18px rgba(2,10,60,.22);min-height:88px}
button.tile{cursor:pointer}
.tile b{display:block;font-size:1.8rem;line-height:1.05}
.tile span{font-size:.88rem;font-weight:800;color:var(--mut)}
.tile.on{outline:4px solid var(--yel);outline-offset:1px}
.t-red{--ac:#e5243b}.t-yel{--ac:#ffc21a}.t-blue{--ac:#0b3fd1}.t-gray{--ac:#8aa0d6}
.tile.wide{grid-column:1/-1;min-height:64px;display:flex;align-items:center;justify-content:space-between}
.tile.wide b{font-size:1.4rem}
.bar{height:16px;border-radius:99px;background:#dfe8fb;overflow:hidden}
.bar>i{display:block;height:100%;background:linear-gradient(90deg,var(--yel),#ffdf7a);border-radius:99px;transition:width .5s}
.pills{display:flex;flex-wrap:wrap;margin:-4px}
.pills>*{margin:4px}

/* filter tanggal, laporan harian, tombol hapus (v6) */
.dfp{margin-bottom:12px}
.dft{font-weight:800;color:var(--navy);margin-bottom:10px}
.dchips{display:flex;flex-wrap:wrap;margin:-4px}
.dchips>*{margin:4px}
.dchip{min-height:48px;padding:8px 16px;border-radius:999px;border:2px solid var(--line);background:#fff;color:var(--blue);font-family:inherit;font-weight:800;font-size:.95rem;line-height:1.1;cursor:pointer}
.dchip.on{background:var(--blue);border-color:var(--blue);color:#fff}
.dchip:focus-visible{outline:4px solid var(--navy);outline-offset:2px}
.dfinfo{margin-top:10px}
.btn-del{background:#fff;color:var(--red);border:2px solid #f1b1ba;box-shadow:none}
.rdate{display:grid;grid-template-columns:58px 1fr 58px;grid-gap:8px;gap:8px;align-items:center}
.rdate .btn{padding:0;font-size:1.7rem}
.rk tr.pick{cursor:pointer}.rk tr.pick:active{background:var(--sky)}
.rk td small{display:block;font-weight:600;font-size:.58rem;color:var(--mut);line-height:1.2;white-space:nowrap}
.rk td small.off{color:var(--red)}
.rk2 th,.rk2 td{padding-left:1px;padding-right:1px}
.rlink{background:none;border:0;padding:0;margin:0;font:inherit;font-weight:800;color:var(--blue);text-align:left;text-decoration:underline;cursor:pointer}
.rlink:focus-visible{outline:3px solid var(--navy);outline-offset:2px}

/* target telepon harian, laporan rinci, capaian (v7) */
.tgp{margin-bottom:12px}
.tgh{display:flex;align-items:baseline;justify-content:space-between}
.tgh b{font-size:2.2rem;line-height:1;color:var(--navy)}
.tgh b small{font-size:1rem;font-weight:800;color:var(--mut)}
.tgh span{font-size:1.2rem;font-weight:800;color:var(--navy)}
.tgm{font-weight:800;color:var(--navy)}
.tgl{font-size:.88rem;font-weight:700;color:var(--mut);margin-top:4px}
.pbar{height:14px;border-radius:999px;background:var(--sky);border:2px solid var(--line);overflow:hidden;margin:8px 0 6px}
.pbar>i{display:block;height:100%;border-radius:999px;background:var(--blue)}
.pbar.ok>i{background:#15803d}.pbar.mid>i{background:var(--yel)}.pbar.low>i{background:var(--red)}.pbar.own>i{background:var(--blue)}
.cap{padding:10px 0;border-bottom:1px solid var(--line)}.cap:first-child{padding-top:0}.cap:last-child{border-bottom:0;padding-bottom:0}
.capn{font-size:1rem}.capv{font-weight:800;color:var(--navy);font-size:.95rem;white-space:nowrap}
.hrow{display:grid;grid-template-columns:44px 1fr 28px;grid-gap:8px;gap:8px;align-items:center;margin:5px 0;font-weight:800;font-size:.8rem;color:var(--navy)}
.hrow b{text-align:right}
.hbar{position:relative;height:16px;border-radius:6px;background:var(--sky);overflow:hidden}
.hbar>i{position:absolute;left:0;top:0;bottom:0;background:#9db6ee}
.hbar>u{position:absolute;left:0;top:0;bottom:0;background:var(--blue);text-decoration:none}
.seg.seg3{grid-template-columns:1fr 1fr 1fr;grid-gap:8px;gap:8px}
.seg.seg3 .btn{padding:8px 4px;font-size:.82rem;line-height:1.15;min-height:56px}
.rk td.cell{cursor:pointer;font-weight:800}
.rk td.cg{background:#d9f5e3;color:#0b5a2b}.rk td.cy{background:#fff2c4;color:#5a3d00}.rk td.cr{background:#ffd9de;color:#8a1020}.rk td.c0{color:#8aa0d6;font-weight:600}
.rk td.tot2{font-weight:800;background:var(--sky)}
.rkc th,.rkc td{padding:7px 1px;font-size:.76rem}.rkc th{font-size:.58rem}
.det{margin:6px 0 0;font-size:.88rem;color:var(--mut);line-height:1.45;word-break:break-word}
.rk th.l,.rk td.l{text-align:left}

/* navigasi bawah (admin) */
.bnav{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;justify-content:space-around;max-width:760px;margin:0 auto;padding:8px 6px 8px;padding:8px 6px calc(8px + env(safe-area-inset-bottom));background:rgba(255,255,255,.98);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);box-shadow:0 -6px 24px rgba(2,10,60,.3);border-radius:22px 22px 0 0}
.bi{flex:1;max-width:160px;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:62px;padding:4px 2px;border:0;background:none;font-family:inherit;font-size:.78rem;font-weight:800;line-height:1.15;color:var(--mut);border-radius:14px;cursor:pointer;text-align:center}
.bi i{font-style:normal;font-size:1.5rem;line-height:1.1;margin-bottom:2px}
.bi.on{color:var(--blue);background:var(--sky)}

/* login */
.login{min-height:100vh;min-height:calc(100vh - 40px);display:flex;align-items:center;justify-content:center}
.login .panel{width:100%;max-width:440px;padding:24px 20px}
.login h1{margin:0;text-align:center;font-size:1.3rem;color:var(--navy);line-height:1.2}
.login .tag{margin:4px 0 8px;text-align:center;color:var(--mut);font-size:.9rem}

/* duplikat */
.grp{margin-bottom:14px}
.row-it{display:flex;align-items:flex-start;padding:12px;border-radius:16px;background:var(--sky);margin-top:10px}
.row-it>input{margin:2px 12px 0 0}
.seg{display:grid;grid-gap:10px;gap:10px;grid-template-columns:1fr 1fr;margin:10px 0 14px}

/* lain-lain */
#loader{position:fixed;top:0;right:0;bottom:0;left:0;z-index:90;display:none;flex-direction:column;align-items:center;justify-content:center;background:rgba(3,16,71,.45)}
#loader.show{display:flex}
.spin{width:56px;height:56px;border-radius:50%;border:6px solid rgba(255,255,255,.3);border-top-color:var(--yel);animation:sp .8s linear infinite}
.ltx{margin-top:14px;color:#fff;font-weight:800}
@keyframes sp{to{transform:rotate(360deg)}}
#toast{position:fixed;left:0;right:0;bottom:100px;bottom:calc(96px + env(safe-area-inset-bottom));z-index:100;display:flex;justify-content:center;padding:0 14px;pointer-events:none}
.tst{width:100%;max-width:460px;padding:14px 16px;border-radius:16px;font-weight:800;font-size:1rem;text-align:center;color:#fff;box-shadow:0 8px 24px rgba(0,0,0,.4);animation:dn .25s}
.tst.ok{background:#0b8f4a}.tst.err{background:var(--red)}
@keyframes dn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
#errbar{position:fixed;left:10px;right:10px;top:10px;z-index:120;background:#9b1226;color:#fff;padding:12px 14px;border-radius:14px;font-weight:700;font-size:.85rem;word-break:break-word;box-shadow:0 8px 24px rgba(0,0,0,.4)}
#boot{min-height:70vh;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;font-weight:800;text-align:center;padding:0 10px}
#boot .spin{margin-bottom:16px}
#boot p{margin:6px 0}
#modal{position:fixed;top:0;right:0;bottom:0;left:0;z-index:80;display:none;align-items:flex-end;justify-content:center}
#modal.show{display:flex}
.mback{position:absolute;top:0;right:0;bottom:0;left:0;background:rgba(3,16,71,.6);cursor:pointer}
.mbox{position:relative;width:100%;max-width:560px;max-height:92vh;overflow:auto;background:#fff;border-radius:26px 26px 0 0;padding:20px 18px 22px;padding:20px 18px calc(22px + env(safe-area-inset-bottom));color:var(--ink)}
.mbox h2{margin:0 0 6px;font-size:1.3rem;color:var(--navy)}
.mbox pre{white-space:pre-wrap;font-family:inherit;margin:8px 0 14px}
.two{display:grid;grid-gap:10px;gap:10px;grid-template-columns:1fr 1fr;margin-top:14px}
.two.flat{margin-top:0}
@media(min-width:900px){.cards{grid-template-columns:1fr 1fr}.tiles{grid-template-columns:repeat(4,1fr)}.tile.wide{grid-column:auto}#modal{align-items:center}.mbox{border-radius:26px}.bnav{border-radius:22px}}
@media(prefers-reduced-motion:reduce){.blob{animation:none}}
</style>
</head>

<!-- CLR-AWAL-v7 -->
<noscript><div style="position:relative;z-index:5;margin:16px;padding:16px;border-radius:14px;background:#fff;color:#9b1226;font:bold 18px Arial,sans-serif">JavaScript di browser ini dimatikan, sehingga aplikasi tidak bisa tampil. Aktifkan JavaScript atau pakai Chrome terbaru.</div></noscript>
<canvas id="stars"></canvas>
<div class="blob b1"></div><div class="blob b2"></div>

<div id="loader"><div class="spin"></div><div class="ltx">Mohon tunggu…</div></div>
<div id="modal"></div>
<div id="toast"></div>

<!-- PENGAMAN: skrip kecil ini sengaja terpisah dan ditulis ES5 supaya tetap jalan walau skrip utama di bawah gagal dibaca
     (misalnya file Index.html tersalin tidak lengkap). Tugasnya: memunculkan pesan merah yang jelas, bukan layar kosong. -->
<script>
(function(){
  var VER = 'v7', mulai = false, PENANDA = 'CLR-AWAL-v7';
  function bar(){ return document.getElementById('errbar'); }
  function esc(s){ return String(s).replace(/[&<>"]/g, function(c){ return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
  function show(html){ var b = bar(); if (!b) return; b.innerHTML = html; b.hidden = false; }
  var b0 = bar(); if (b0) b0.onclick = function(){ b0.hidden = true; };
  /* dipanggil oleh skrip utama begitu ia berhasil dibaca dan mulai berjalan */
  window.__clrMulai = function(){ mulai = true; };
  window.addEventListener('error', function(e){
    var m = (e && e.message) || 'tidak diketahui', ln = (e && e.lineno) ? ' (baris ' + e.lineno + ')' : '', cuplik = '';
    try {
      var ss = document.getElementsByTagName('script'), n = e && e.lineno;
      for (var i = 0; n && i < ss.length; i++) { var L = (ss[i].text || '').split('\n')[n - 1]; if (L) cuplik += '<br><span style="font-weight:400;font-size:.75rem">blok ' + i + ': ' + esc(L.slice(0, 110)) + '</span>'; }

function withCv(p){ const o = {}; if (p) for (const k in p) o[k] = p[k]; o.cv = VER; return o; }
function call(action, payload, opts){
  opts = opts || {};
  return new Promise((resolve, reject) => {
    if (typeof google === 'undefined' || !google.script || !google.script.run) { reject(new Error('Buka aplikasi lewat link Web App Google Apps Script (bukan dari file).')); return; }
    if (!opts.silent) busy(1);
    google.script.run
      .withSuccessHandler(res => {
        if (!opts.silent) busy(-1);
        if (res && res.ok) resolve(res.data);
        else {
          if (res && res.code === 'AUTH' && !opts.quiet) forceLogout(res.error);
          const er = new Error((res && res.error) || 'Terjadi kesalahan'); er.code = res && res.code; reject(er);
        }
      })
      .withFailureHandler(err => { if (!opts.silent) busy(-1); reject(new Error((err && err.message) || String(err))); })
      .api(action, S.token, withCv(payload));
  });
}

const BLN = ['Jan', 'Feb', 'Mar', 'Apr', 'Mei', 'Jun', 'Jul', 'Agu', 'Sep', 'Okt', 'Nov', 'Des'];
const HRI = ['Minggu', 'Senin', 'Selasa', 'Rabu', 'Kamis', 'Jumat', 'Sabtu'];
function p2(n){ return ('0' + n).slice(-2); }
function isoOf(d){ return d.getFullYear() + '-' + p2(d.getMonth() + 1) + '-' + p2(d.getDate()); }
function todayIso(){ return isoOf(new Date()); }
function isoPlus(n){ const d = new Date(); d.setDate(d.getDate() + n); return isoOf(d); }
function dateOfIso(s){ const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(s || ''); return m ? new Date(+m[1], +m[2] - 1, +m[3]) : null; }
function fuText(s){ const d = dateOfIso(s); return d ? HRI[d.getDay()] + ', ' + d.getDate() + ' ' + BLN[d.getMonth()] + ' ' + d.getFullYear() : ''; }
function fuDiff(s){ const d = dateOfIso(s), n = dateOfIso(todayIso()); return d ? Math.round((d - n) / 86400000) : 0; }
function fuLabel(s){ const n = fuDiff(s); return n < 0 ? 'TERLAMBAT ' + (-n) + ' hari' : n === 0 ? 'HARI INI' : n === 1 ? 'Besok' : n + ' hari lagi'; }

(function(){
  const c = $('#stars'), x = c.getContext && c.getContext('2d'); if (!x) return;
  let W, H, st = [];
  function size(){ W = c.width = window.innerWidth; H = c.height = window.innerHeight;
    const n = Math.min(Math.round(W * H / 14000), 110);
    st = Array.from({ length: n }, () => ({ x: Math.random() * W, y: Math.random() * H, r: Math.random() * 1.4 + .3, p: Math.random() * 6.28, s: Math.random() * .02 + .005, dx: (Math.random() - .5) * .05, c: Math.random() < .2 ? '255,226,130' : '255,255,255' })); }
  function draw(){ x.clearRect(0, 0, W, H);
    for (const s of st){ s.p += s.s; s.x += s.dx; if (s.x < 0) s.x = W; if (s.x > W) s.x = 0;
      const a = .25 + .6 * Math.abs(Math.sin(s.p));
      x.beginPath(); x.arc(s.x, s.y, s.r, 0, 6.283); x.fillStyle = 'rgba(' + s.c + ',' + a.toFixed(2) + ')'; x.fill(); }
    requestAnimationFrame(draw); }
  size(); window.addEventListener('resize', size); draw();
})();

async function checkServer(){
  const set = (cls, txt) => { const e = $('#srv'); if (e) { e.className = 'srv ' + cls; e.textContent = txt; } };
  try {
    const d = await call('ping', {}, { silent: true, quiet: true });
    if (d && d.ready === false) set('bad', '\u25cf ' + (d.msg || 'Aplikasi belum disiapkan'));
    else if (d && d.ver && d.ver !== VER) set('warn', '\u25cf Terhubung ke server, TETAPI versi berbeda: Code.gs di Google ' + d.ver + ', file ini ' + VER + '. Ganti Code.gs dengan yang terbaru lalu Terapkan \u2192 Kelola penerapan \u2192 Versi baru.');
    else set('ok', LOCAL ? '\u25cf Mode mandiri: data tersimpan di perangkat ini' : '\u25cf Terhubung ke server');
  } catch (e) {
    if (e.code === 'AUTH') set('warn', '\u25cf Terhubung ke server, TETAPI Code.gs di Google masih versi lama. Ganti Code.gs dengan yang terbaru lalu Terapkan \u2192 Kelola penerapan \u2192 Versi baru.');
    else set('bad', '\u25cf Tidak dapat terhubung ke server: ' + String(e.message).slice(0, 140));
  }
}

function emT(t){ const s = String(t || ''); return s.length >= 16 ? s.slice(0, 5) + ' ' + s.slice(11, 16) : s; }
function mbOf(b){ return (Math.round(b / 1048576 * 10) / 10).toString().replace('.', ','); }
function refreshCard(r){
  renderTiles();

  if (!old) return; /* kartu sedang tidak tampil (mis. sudah pindah kotak): cukup angka kotak yang diperbarui */

  const was = old.querySelector('details'); if (was && was.open) el.querySelector('details').open = true;

function emIn(r, f){
  const s = r.em ? r.em.st : '';
  return f === 'emw' ? (s === 'MENUNGGU' || s === 'MENGIRIM') : f === 'ems' ? s === 'TERKIRIM' : (s === 'DITOLAK' || s === 'GAGAL');
}
function emTiles(rows){
  const n = f => rows.filter(r => emIn(r, f)).length;
  return [['_h', 'Email Penawaran'], ['emw', 'Menunggu Admin', n('emw'), 't-yel'], ['ems', 'Email Terkirim', n('ems'), 't-blue'], ['emx', 'Ditolak / Gagal', n('emx'), 't-red']];

function emBlock(r){

function nextStep(r, fields){
  if (!r || r.status !== ST[2]) return;
  if (!r.solar && ('status' in fields)) askSolar(r);
  else if (r.solar && !r.penaw && ('solar' in fields)) askPenaw(r);
  else if (r.solar && r.penaw && !r.fu && ('penaw' in fields)) { if (MAIL && r.penaw === PW[0] && !r.em) askEmailStep(r); else askFuStep(r); }
}

async function saveRow(row, fields){
  const r = S.rows.find(x => x.row === row); if (!r) return;
  const old = $('#c-' + row); if (old) { old.style.opacity = '.5'; old.style.pointerEvents = 'none'; }
  try {
    const d = await call('update', { sheet: S.sheet, row: row, nama: r.nama, fields: fields }, { silent: true });
    r.status = d.status; r.solar = d.solar || ''; r.penaw = d.penaw || '';
    r.fu = d.fu || ''; r.pic = d.pic; r.email = d.email; r.ket = d.ket;
    if (d.act) { r.act = d.act; r.actT = d.actT || ''; }
    if ('status' in fields) todayBump(r.nama, r.status); /* hitungan Target Hari Ini mengikuti aturan server: satu perusahaan sekali per hari */
    r._keep = r.status === ST[2] && !(r.solar && r.penaw); /* kartu tetap tampil sampai pertanyaan solar & penawaran terjawab */
    renderTiles();
    if ((S.filter !== 'all' || dfOn()) && !passes(r)) {
      const g = S.df; S.df = null; const moved = !passes(r); S.df = g; /* dipindah ke kotak lain, atau hanya tersaring oleh filter tanggal? */
      toast(moved ? '\u2714 Tersimpan. Data dipindah ke kotak "' + (r.status || 'Belum Diproses') + '".' : '\u2714 Tersimpan. Data dikerjakan hari ini, jadi tidak tampil pada filter tanggal ini.');
      renderCards();
    } else {
      toast('fu' in fields ? (r.fu ? '\u2714 Follow up: ' + fuText(r.fu) : '\u2714 Follow up selesai') : '\u2714 Tersimpan');
      const nw = document.createElement('div'); nw.innerHTML = cardTele(r); const el = nw.firstElementChild;
      const was = old && old.querySelector('details'); if (was && was.open) el.querySelector('details').open = true;
      if (old) old.replaceWith(el); else renderCards();
    }
    nextStep(r, fields);
  } catch (e) { if (old) { old.style.opacity = ''; old.style.pointerEvents = ''; } toast(e.message, 'err'); }
}

async function approveIds(ids){
  const per = (S.em && S.em.d && S.em.d.batch) || 5;
  const flagged = ids.some(id => { const c = document.querySelector('.emchk[data-id="' + id + '"]'); return c && c.dataset.flag === '1'; });
  const lamp = S.em && S.em.d && S.em.d.compro && S.em.d.compro.ok ? ' (dengan lampiran Company Profile)' : ' (tanpa lampiran)';
  const msg = 'Kirim ' + ids.length + ' email penawaran' + lamp + ' sekarang? Email yang sudah terkirim tidak bisa ditarik kembali.' + (flagged ? '\n\nAda tanda \u26a0 pada sebagian pengajuan ini. Pastikan sudah Anda periksa.' : '');
  if (!await ask('Setujui & kirim?', msg, 'Ya, kirim')) return;
  const hasil = [], pesan = $('.ltx');
  let fatal = '';
  busy(1);
  try {
    for (let i = 0; i < ids.length; i += per) {
      if (pesan) pesan.textContent = 'Mengirim email ' + Math.min(i + per, ids.length) + ' dari ' + ids.length + '\u2026';
      const d = await call('emailApprove', { ids: ids.slice(i, i + per) }, { silent: true });
      d.hasil.forEach(h => hasil.push(h));
    }
  } catch (e) { fatal = e.message; }
  busy(-1); if (pesan) pesan.textContent = 'Mohon tunggu\u2026';
  const okN = hasil.filter(h => h.ok).length, bad = hasil.filter(h => !h.ok), warn = hasil.filter(h => h.warn);
  const list = bad.map(h => `<div class="warnbox" style="margin-bottom:8px">${esc(h.nama || 'Pengajuan')}${h.email ? ' (' + esc(h.email) + ')' : ''}: ${esc(h.msg)}</div>`).join('')
    + warn.map(h => `<div class="warnbox" style="margin-bottom:8px">${esc(h.nama || '')}: ${esc(h.warn)}</div>`).join('')
    + (fatal ? `<div class="warnbox" style="margin-bottom:8px">\u26a0 ${esc(fatal)}</div>` : '');
  const toSet = fatal && /Company Profile|Drive/i.test(fatal) ? '<button class="btn btn-blue block" data-act="emtoset">\u2699 Buka Pengaturan Email</button>' : '';
  modal(`<h2>${okN ? '\u2714 ' + okN + ' email terkirim' : 'Belum ada email yang terkirim'}</h2>
    ${bad.length ? '<p class="sub"><b>' + bad.length + ' belum terkirim:</b></p>' : ''}${list}
    <div class="stack" style="margin-top:14px">${toSet}<button class="btn btn-yel block" data-act="emdone">Tutup</button></div>`);
}

  const nx = isoOf(d); if (nx > todayIso()) { toast('Belum ada laporan untuk tanggal yang akan datang', 'err'); return; }
  R.date = nx; rpGo();
};
ACT.rquick = el => { rpState().date = isoPlus(+el.dataset.n); rpGo(); };
ACT.rdrill = el => { rpState().tele = el.dataset.s || ''; rpGo(); };
ACT.rmore = () => { rpState().shown += 20; drawReportItems(); };
ACT.rfilt = el => { const R = rpState(); R.f = el.dataset.f; R.shown = 20; drawReportItems(); };
function hh2(h){ return (h < 10 ? '0' : '') + h; }
function minOf(hm){ const m = /^(\d{1,2}):(\d{2})/.exec(hm || ''); return m ? +m[1] * 60 + +m[2] : -1; }
function paceText(x){
  const a = minOf(x.c1), b = minOf(x.c2);
  if (x.dihubungi < 2 || a < 0 || b - a < 30) return '';
  return ' \u00b7 rata-rata ' + (Math.round(x.dihubungi / ((b - a) / 60) * 10) / 10).toString().replace('.', ',') + ' data/jam';
}
function rpActive(x, two){ return x.first ? esc(x.first) + (two ? '\u2013' : ' \u2013 ') + esc(x.last) + (two ? '<br>' : ' \u00b7 ') + x.aksi + ' aksi' : 'belum aktif'; }
function hourChart(jam, ok){
  let a = -1, b = -1, mx = 0;
  jam.forEach((n, h) => { if (n) { if (a < 0) a = h; b = h; if (n > mx) mx = n; } });
  if (a < 0) return '';
  a = Math.min(a, 8); b = Math.max(b, 16); /* jam kerja biasa (08 sampai 16) selalu tampil */
  let rows = '';
  for (let h = a; h <= b; h++) rows += `<div class="hrow"><span>${hh2(h)}:00</span><div class="hbar"><i style="width:${Math.round(jam[h] * 100 / mx)}%"></i><u style="width:${Math.round(ok[h] * 100 / mx)}%"></u></div><b>${jam[h]}</b></div>`;
  return `<div class="panel" style="margin-bottom:14px"><div class="dft">\u23f1 Telepon per Jam</div>${rows}<p class="addr" style="margin:8px 0 0">Angka = prospek yang pertama kali dihubungi pada jam itu. Warna tua = yang terhubung.</p></div>`;
}
function capLine(x, g){
  const z = tgInfo(x.dihubungi, g), tm = x.c1 ? esc(x.c1) + '\u2013' + esc(x.c2) : (x.first ? 'belum ada' : 'belum aktif');
  return `<div class="cap"><div class="c-top"><button class="rlink capn" data-act="rdrill" data-s="${esc(x.sheet)}">${esc(x.nama)}</button><span class="capv">${x.dihubungi} / ${g} \u00b7 ${z.pct}%</span></div>${pbar(x.dihubungi, g)}
    <div class="tgl">${x.dihubungi >= g ? '\u2705 Target tercapai' : 'Kurang ' + z.left + ' data'} \u00b7 telepon ${tm} \u00b7 sisa data ${x.sisa}</div></div>`;
}
function capBig(x, g){
  const z = tgInfo(x.dihubungi, g);
  return `<div class="panel tgp"><div class="dft">\ud83c\udfaf Capaian Target</div>
    <div class="tgh"><b>${x.dihubungi}<small> dari ${g} data</small></b><span>${z.pct}%</span></div>${pbar(x.dihubungi, g)}
    <div class="tgm">${x.dihubungi >= g ? '\u2705 Target tercapai' : 'Kurang ' + z.left + ' data lagi'}</div>
    <div class="tgl">Telepon pertama ${x.c1 ? esc(x.c1) : '-'} \u00b7 terakhir ${x.c2 ? esc(x.c2) : '-'}${paceText(x)}</div>
    <div class="tgl">Sisa data yang belum diproses (saat ini): <b>${x.sisa}</b> dari ${x.data} data</div></div>`;
}
function emBadgeRp(e){
  const w = e.aj ? ' (diajukan ' + esc(e.aj) + ')' : '';
  if (e.st === 'TERKIRIM') return '<span class="badge bd-blue">\u2709 Email terkirim ' + esc(e.kp) + w + '</span>';
  if (e.st === 'MENUNGGU' || e.st === 'MENGIRIM') return '<span class="badge bd-yel">\u2709 Email menunggu admin' + w + '</span>';
  if (e.st === 'DITOLAK') return '<span class="badge bd-red">\u2709 Email ditolak ' + esc(e.kp) + w + '</span>';
  if (e.st === 'GAGAL') return '<span class="badge bd-red">\u2709 Email gagal dikirim ' + esc(e.kp) + w + '</span>';
  return '<span class="badge">\u2709 Pengajuan dibatalkan' + w + '</span>';
}
function rpMatch(it, f){
  if (f === 'ok') return it.stSet && it.status === ST[2];
  if (f === 'tm') return it.stSet && it.status === ST[1];
  if (f === 'tdh') return it.stSet && it.status === ST[0];
  if (f === 'tawar') return it.penaw === PW[0];
  if (f === 'em') return !!it.em;
  return true;
}
function rpItem(it){
  const b = [];
  if (it.stSet && it.status) b.push(badgeOf(it.status)); else if (!it.stSet && !it.em) b.push('<span class="badge">Memperbarui data</span>');
  if (it.stSet && !it.status) b.push('<span class="badge">Status dibatalkan</span>');
  if (it.solar) b.push(it.solar === SL[0] ? '<span class="badge bd-yel">\u26fd Memakai solar</span>' : '<span class="badge">\ud83d\udeab Tidak memakai solar</span>');
  if (it.penaw) b.push(it.penaw === PW[0] ? '<span class="badge bd-blue">\u2705 Penawaran dilakukan</span>' : '<span class="badge">\u2716 Tanpa penawaran</span>');
  if (it.fu) b.push('<span class="badge bd-red">\ud83d\udcde Follow up ' + esc(fuText(it.fu)) + '</span>'); else if (it.fuDone) b.push('<span class="badge">\ud83d\udcde Follow up selesai</span>');
  if (MAIL && it.em) b.push(emBadgeRp(it.em));
  const L = [];
  if (it.telp) L.push('\ud83d\udcde ' + esc(it.telp));
  if (it.kota) L.push('\ud83d\udccd ' + esc(it.kota));
  if (it.pic) L.push('\ud83d\udc64 PIC: ' + esc(it.pic));
  if (it.email) L.push('\u2709 ' + esc(it.email));
  if (it.ket) L.push('\ud83d\udcdd ' + esc(it.ket));
  const when = it.ts || it.t1, again = it.n > 1 || (it.ts && it.t2 !== it.ts) ? '<br>Disimpan ' + it.n + 'x, terakhir ' + esc(it.t2) : '';
  return `<div class="card"><div class="c-top"><h3 style="font-size:1.05rem">${esc(it.nama)}</h3><span class="no">${esc(when)}</span></div><div class="pills">${b.join('')}</div>${L.length || again ? '<p class="det">' + L.join('<br>') + again + '</p>' : ''}</div>`;
}
function drawReportItems(){
  const R = rpState(), d = R.d, el = $('#ritems'); if (!el || !d) return;
  const F = [['all', 'Semua'], ['ok', 'Terhubung'], ['tm', 'Tidak Menjawab'], ['tdh', 'Tidak Dapat Dihubungi'], ['tawar', 'Penawaran']].concat(MAIL && d.mail ? [['em', 'Email']] : []);

  el.innerHTML = chips + (show.length ? '<div class="cards">' + show.map(rpItem).join('') + '</div>' : '<div class="panel" style="text-align:center;font-weight:800">' + (d.items.length ? 'Tidak ada prospek pada pilihan ini.' : 'Belum ada aktivitas telemarketing ini pada tanggal tersebut.') + '</div>')

}

/* ---- CAPAIAN TARGET beberapa hari ---- */
const HRS = ['Min', 'Sen', 'Sel', 'Rab', 'Kam', 'Jum', 'Sab'];
async function loadRange(){
  const R = rpState(); if (!$('#rbody')) return;
  R.c = await call('reportRange', { date: R.end, days: R.days });
  drawRange();
}
function rcGo(){ loadRange().catch(e => toast(e.message, 'err')); }
ACT.rcgo = rcGo;
ACT.rcdays = el => { rpState().days = +el.dataset.n; rcGo(); };
ACT.rcnow = () => { rpState().end = todayIso(); rcGo(); };
ACT.rcell = el => { const R = rpState(); R.mode = 'harian'; R.date = el.dataset.d; R.tele = el.dataset.s || ''; vReport($('#view')).catch(e => toast(e.message, 'err')); };
function drawRange(){
  const R = rpState(), c = R.c, host = $('#rbody'); if (!host || !c) return;
  const g = c.target, T = c.teles, days = c.days.slice().reverse(); /* terbaru di atas */
  const cls = n => n >= g ? 'cg' : n >= g * 0.6 ? 'cy' : n > 0 ? 'cr' : 'c0';
  const dlab = iso => { const d = dateOfIso(iso); return d ? HRS[d.getDay()] + ' ' + d.getDate() : iso; };
  const sum = {}, work = {}, hit = {}; let allSum = 0, allWork = 0;
  T.forEach(x => { sum[x.sheet] = 0; work[x.sheet] = 0; hit[x.sheet] = 0; });
  c.days.forEach(d => {
    let tot = 0;
    T.forEach(x => { const n = d.per[x.sheet] ? d.per[x.sheet].n : 0; tot += n; sum[x.sheet] += n; if (n > 0) work[x.sheet]++; if (n >= g) hit[x.sheet]++; });
    allSum += tot; if (tot > 0) allWork++;
  });
  const head = `<tr><th class="l">Tanggal</th>${T.map(x => `<th>${esc(x.nama)}</th>`).join('')}<th>Total</th></tr>`;
  const body = days.map(d => {
    let tot = 0;
    const cells = T.map(x => { const n = d.per[x.sheet] ? d.per[x.sheet].n : 0; tot += n; return `<td class="cell ${cls(n)}" data-act="rcell" data-d="${esc(d.date)}" data-s="${esc(x.sheet)}">${n}</td>`; }).join('');
    return `<tr><td class="l"><button class="rlink" data-act="rcell" data-d="${esc(d.date)}" data-s="">${esc(dlab(d.date))}</button></td>${cells}<td class="tot2">${tot}</td></tr>`;
  }).join('');
  const avg = (s0, w0) => w0 ? Math.round(s0 / w0) : 0;
  const foot = `<tr class="tot"><td class="l">Rata-rata</td>${T.map(x => `<td>${avg(sum[x.sheet], work[x.sheet])}</td>`).join('')}<td>${avg(allSum, allWork)}</td></tr>
    <tr class="tot"><td class="l">Capai</td>${T.map(x => `<td>${hit[x.sheet]}/${work[x.sheet]}</td>`).join('')}<td></td></tr>`;
  const ctl = `<div class="panel stack dfp">
    <div><label class="lb" for="re" style="margin-top:0">Sampai tanggal</label><input class="inp" id="re" type="date" max="${todayIso()}" value="${esc(c.to)}"></div>
    <div class="dchips"><button class="dchip ${R.days === 7 ? 'on' : ''}" data-act="rcdays" data-n="7">7 Hari</button><button class="dchip ${R.days === 14 ? 'on' : ''}" data-act="rcdays" data-n="14">14 Hari</button><button class="dchip ${c.to === todayIso() ? 'on' : ''}" data-act="rcnow">Sampai Hari Ini</button></div></div>`;
  host.innerHTML = `<div class="ttl">Capaian Target ${c.days.length} Hari</div>${tgtBox(g)}${ctl}
    ${c.truncated ? '<div class="warnbox" style="margin-bottom:12px">Catatan aktivitas sangat banyak, hanya sebagian yang terbaca. Angka mungkin kurang lengkap.</div>' : ''}
    <div class="panel rkw" style="padding:12px 8px;margin-bottom:14px"><table class="rk rkc"><thead>${head}</thead><tbody>${body}${foot}</tbody></table>
      <p class="addr" style="margin:10px 6px 0">Angka = prospek yang dihubungi hari itu. \ud83d\udfe9 tercapai (${g} atau lebih) \u00b7 \ud83d\udfe8 ${Math.ceil(g * 0.6)} atau lebih \u00b7 \ud83d\udfe5 di bawah itu \u00b7 abu-abu = tidak ada telepon. Rata-rata dan Capai dihitung dari hari yang ada teleponnya. Ketuk angka untuk melihat rinciannya.</p></div>
    <button class="btn btn-yel block" style="margin-top:6px" data-act="rcgo">\u27f3 Segarkan</button>`;
  const ei = $('#re'); if (ei) ei.onchange = e => { if (!dateOfIso(e.target.value)) return; R.end = e.target.value; rcGo(); };
}

  v.innerHTML = `<div class="panel"><h2 style="margin:0 0 6px;color:var(--navy)">Cek Data Ganda</h2>
    <p class="sub">Mencari perusahaan dengan <b>nomor telepon sama</b> atau <b>nama sama</b>.</p>
    <div class="seg"><button class="btn ${S.dupScope === 'tele' ? 'btn-blue' : 'btn-light'}" data-act="dscope" data-s="tele">Data Telemarketing</button><button class="btn ${S.dupScope === 'center' ? 'btn-blue' : 'btn-light'}" data-act="dscope" data-s="center">Database Center</button></div>
    <button class="btn btn-yel block" style="min-height:64px" data-act="dscan">\ud83d\udd0d CARI DATA GANDA</button></div><div id="dres" style="margin-top:14px"></div>`;
  if (S.dupData) renderDups();
}
ACT.dscope = el => {
  S.dupScope = el.dataset.s; S.dupData = null; $('#dres').innerHTML = '';
  document.querySelectorAll('[data-act=dscope]').forEach(b => { const on = b === el; b.classList.toggle('btn-blue', on); b.classList.toggle('btn-light', !on); });
};
ACT.dscan = async () => { try { S.dupData = await call('dups', { scope: S.dupScope }); renderDups(); } catch (e) { toast(e.message, 'err'); } };
function dupActions(){
  return `<div class="stack"><button class="btn btn-light block" data-act="dauto">Pilih otomatis</button><button class="btn btn-red block" data-act="ddel">\ud83d\uddd1 Hapus yang dicentang (<span class="dcnt">0</span>)</button></div>`;
}
function renderDups(){
  const d = S.dupData;
  if (!d.groupCount) { $('#dres').innerHTML = `<div class="panel" style="text-align:center;font-weight:800">\u2714 Tidak ada data ganda dari ${d.scanned} data.</div>`; return; }
  $('#dres').innerHTML = `<div class="panel" style="margin-bottom:14px"><p class="sub" style="margin-top:0">Diperiksa <b>${d.scanned}</b> data \u00b7 <b>${d.groupCount}</b> kelompok ganda \u00b7 <b>${d.extra}</b> baris berlebih${d.groupCount >= 300 ? ' (menampilkan 300 kelompok pertama)' : ''}. Yang dicentang akan dihapus; yang bertanda <b>Pertahankan</b> disimpan.</p>${dupActions()}</div>` +
    d.groups.map(g => `<div class="panel grp"><div class="pills">${g.reasons.map(r => `<span class="badge bd-yel">${esc(r)}</span>`).join('')}</div>
      ${g.items.map((it, ii) => `<label class="row-it"><input type="checkbox" class="dchk" data-sheet="${esc(it.sheet)}" data-row="${it.row}" data-nama="${esc(it.nama)}" ${ii > 0 ? 'checked' : ''}>
        <div><b>${esc(it.nama)}</b> ${ii === 0 ? '<span class="badge bd-blue">Pertahankan</span>' : ''}<div class="addr">${esc(it.sheet)} \u00b7 baris ${it.row} \u00b7 ${esc(it.telp || 'tanpa telepon')}${it.kota ? ' \u00b7 ' + esc(it.kota) : ''}</div>
        ${it.status ? '<div style="margin-top:4px">' + badgeOf(it.status) + '</div>' : ''}${it.pic ? '<div class="addr">PIC: ' + esc(it.pic) + '</div>' : ''}${it.ket ? '<div class="addr">' + esc(it.ket) + '</div>' : ''}</div></label>`).join('')}</div>`).join('') +
    `<div class="panel">${dupActions()}</div>`;
  countChk();
}
function countChk(){ const n = document.querySelectorAll('.dchk:checked').length; document.querySelectorAll('.dcnt').forEach(c => { c.textContent = n; }); }
document.addEventListener('change', e => { if (e.target.classList && e.target.classList.contains('dchk')) countChk(); });
ACT.dauto = () => { document.querySelectorAll('.grp').forEach(g => g.querySelectorAll('.dchk').forEach((c, i) => { c.checked = i > 0; })); countChk(); };
ACT.ddel = async () => {
  const items = [...document.querySelectorAll('.dchk:checked')].map(c => ({ sheet: c.dataset.sheet, row: +c.dataset.row, nama: c.dataset.nama }));
  if (!items.length) { toast('Belum ada yang dicentang', 'err'); return; }
  if (!await ask('Hapus ' + items.length + ' baris?', 'Baris dihapus permanen dari Google Sheets dan nomor urut dirapikan. Tidak bisa dibatalkan.', 'Ya, Hapus', true)) return;
  try {
    const r = await call('deleteRows', { items: items });
    toast('\u2714 ' + r.deleted + ' baris dihapus');
    S.dupData = await call('dups', { scope: S.dupScope }); renderDups();
  } catch (e) { toast(e.message, 'err'); }
};

/* ===================== ADMIN: PENGGUNA ===================== */
async function vUsers(v){
  const us = await call('users');
  v.innerHTML = `<div class="ttl">Kelola Pengguna</div>
  <button class="btn btn-yel block" style="margin-bottom:14px" data-act="addtele">\uff0b Tambah Telemarketing Baru</button>
  <div class="cards">${us.map(u => `<div class="card"><div class="c-top"><h3>${esc(u.sheet)}</h3><span class="badge ${u.role === 'admin' ? 'bd-yel' : 'bd-blue'}">${u.role === 'admin' ? 'Admin' : 'Telemarketing'}</span></div>
    <p class="addr">Nama pengguna: <b>${esc(u.username)}</b> \u00b7 ${u.aktif ? 'Aktif' : '<b style="color:var(--red)">Nonaktif</b>'}</p>
    ${MAIL && u.role !== 'admin' ? phoneRow(u) : ''}
    <button class="btn btn-light block" data-act="rpass" data-u="${esc(u.username)}">\ud83d\udd11 Atur Ulang Kata Sandi</button>
    ${u.role === 'admin' ? '' : `<button class="btn ${u.aktif ? 'btn-red' : 'btn-blue'} block" data-act="tgl" data-u="${esc(u.username)}">${u.aktif ? 'Nonaktifkan Akun' : 'Aktifkan Akun'}</button>`}</div>`).join('')}</div>`;
}
ACT.addtele = () => modal(`<h2>Telemarketing Baru</h2><p class="sub">Sheet baru dibuat otomatis dengan nama ini.</p>
  <label class="lb">Nama (nama sheet)</label><input class="inp" id="n1" placeholder="contoh: Rani">
  <label class="lb">Nama pengguna (huruf kecil)</label><input class="inp" id="n2" autocapitalize="none" placeholder="contoh: rani">
  <label class="lb">Kata sandi awal (minimal 6)</label><input class="inp" id="n3" type="text">
  ${MAIL ? '<label class="lb">Nomor WhatsApp (untuk surat email, boleh kosong)</label><input class="inp" id="n4" inputmode="tel">' : ''}
  <div class="two"><button class="btn btn-light" data-act="mclose">Batal</button><button class="btn btn-blue" data-act="addtelego">Buat</button></div>`);
ACT.addtelego = async () => {
  try { await call('addTele', { nama: $('#n1').value, username: $('#n2').value, password: $('#n3').value, telp: ($('#n4') || {}).value || '' }); mclose(); toast('\u2714 Telemarketing dibuat'); vUsers($('#view')); }
  catch (e) { toast(e.message, 'err'); }
};
ACT.rpass = el => {
  const u = el.dataset.u;
  modal(`<h2>Atur Ulang Kata Sandi</h2><p class="sub">Pengguna: <b>${esc(u)}</b></p><label class="lb">Kata sandi baru (minimal 6)</label><input class="inp" id="rp" type="text">
  <div class="two"><button class="btn btn-light" data-act="mclose">Batal</button><button class="btn btn-blue" data-act="rpassgo" data-u="${esc(u)}">Simpan</button></div>`);
};
ACT.rpassgo = async el => {
  try { await call('resetPass', { username: el.dataset.u, password: $('#rp').value }); mclose(); toast('\u2714 Kata sandi diubah'); } catch (e) { toast(e.message, 'err'); }
};
ACT.tgl = async el => {
  try { const on = await call('toggleUser', { username: el.dataset.u }); toast(on ? '\u2714 Akun diaktifkan' : 'Akun dinonaktifkan'); vUsers($('#view')); } catch (e) { toast(e.message, 'err'); }
};

/* ===================== MULAI ===================== */
function tanpaSinyal(msg){
  showLogin(msg);
  const e = document.getElementById('lerr'); if (!e) return;
  const b = document.createElement('button'); b.type = 'button'; b.className = 'btn btn-light block'; b.id = 'lagi'; b.style.marginTop = '12px'; b.textContent = '\ud83d\udd04 COBA LAGI';
  b.onclick = () => { b.disabled = true; b.textContent = 'MENYAMBUNG\u2026'; masuk(); };
  e.parentNode.insertBefore(b, e.nextSibling);
}
function masuk(){
  const s = loadStore();
  if (!(s && s.token)) { showLogin(); return; }
  S.token = s.token;
  let selesai = false;
  /* bila server Google lambat menjawab, jangan biarkan layar menunggu terus: tampilkan halaman masuk */
  const jaga = setTimeout(() => { if (selesai) return; selesai = true; S.token = null; tanpaSinyal('Server belum menjawab. Periksa sinyal internet, lalu ketuk COBA LAGI.'); }, 15000);
  call('me', {}, { quiet: true, silent: true }).then(d => {
    if (selesai) return; selesai = true; clearTimeout(jaga);
    try { S.user = d.user; showApp(); }
    catch (e) { S.token = null; S.user = null; store(null); showLogin('Gagal membuka halaman: ' + e.message); }
  }).catch(er => { if (selesai) return; selesai = true; clearTimeout(jaga); S.token = null; if (er && er.code === 'AUTH') { store(null); showLogin(); } else tanpaSinyal(er && /^Tidak bisa menghubungi/.test(er.message || '') ? 'Belum tersambung ke server. Periksa sinyal internet, lalu ketuk COBA LAGI.' : String((er && er.message) || 'Belum tersambung ke server.')); });
}
try { masuk(); } catch (e) { showLogin('Gagal memulai: ' + e.message); }
var PENANDA_AKHIR = 'CLR-AKHIR-v7';
})();
</script>
